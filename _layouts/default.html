<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrap navigation">
        <a class="brand" href="{{ '/' | relative_url }}">Punit Lohani<span>.</span></a>
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/articles' | relative_url }}">Articles</a>
          <a href="{{ '/about' | relative_url }}">About</a>
          <a href="https://github.com/punitlohani-umn">GitHub</a>
        </nav>
      </div>
    </header>
    <main>{{ content }}</main>
    <footer class="site-footer"><div class="wrap"><p>© {{ 'now' | date: '%Y' }} Punit Lohani · Product Analytics</p></div></footer>
  </body>
</html>
